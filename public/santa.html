<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your Secret Santa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module">
    import { api, confetti, el, exchangeFacts, letItSnow, portrait, toast } from '/common.js';

    letItSnow();
    const app = document.getElementById('app');
    const token = location.pathname.split('/').filter(Boolean).pop();

    const LIGHTS = `<svg class="lights" viewBox="0 0 600 70" aria-hidden="true">
      <path d="M0 14 Q150 46 300 20 Q450 -6 600 22" fill="none" stroke="#0b1f18" stroke-width="2.5"/>
      <line x1="300" y1="20" x2="300" y2="70" stroke="#e7d5bd" stroke-width="3" stroke-dasharray="6 4"/>
      <g class="bulbs">
        <circle cx="45" cy="29" r="7" fill="#b8322a"/><circle cx="105" cy="36" r="7" fill="#5dcaa5"/>
        <circle cx="165" cy="38" r="7" fill="#e9b949"/><circle cx="234" cy="35" r="7" fill="#b8322a"/>
        <circle cx="366" cy="18" r="7" fill="#5dcaa5"/><circle cx="435" cy="14" r="7" fill="#e9b949"/>
        <circle cx="504" cy="16" r="7" fill="#b8322a"/><circle cx="570" cy="24" r="7" fill="#5dcaa5"/>
      </g>
    </svg>`;
    const HOLLY = `<svg class="holly" viewBox="0 0 44 32" aria-hidden="true">
      <path d="M20 20 Q5 19 2 4 Q17 6 20 20Z" fill="#2e7d4f"/>
      <path d="M24 20 Q39 19 42 4 Q27 6 24 20Z" fill="#256b42"/>
      <path d="M19 18 L6 7 M25 18 L38 7" stroke="#1d5a36" stroke-width="1.2"/>
      <circle cx="18" cy="20" r="5" fill="#b8322a"/><circle cx="27" cy="21" r="5" fill="#b8322a"/><circle cx="22" cy="27" r="5" fill="#8f2119"/>
    </svg>`;
    const markup = (html) => {
      const template = document.createElement('template');
      template.innerHTML = html;
      return template.content.firstElementChild;
    };

    async function load() {
      try {
        render(await api(`/api/santa/${token}`));
      } catch (error) {
        app.replaceChildren(el('section', { class: 'card center' },
          el('h2', {}, 'Bah, humbug!'),
          el('p', {}, error.message),
        ));
      }
    }

    function render(view) {
      document.title = `${view.me.name}'s Secret Santa`;
      const { budget } = view.exchange;
      app.replaceChildren(
        el('header', { class: 'hero' },
          el('h1', {}, view.exchange.name),
          markup(LIGHTS),
          el('div', { class: `tag ${budget ? 'has-budget' : ''}` },
            markup(HOLLY),
            el('div', { class: 'tag-body' },
              el('div', { class: 'polaroid mini' }, portrait(view.me)),
              el('div', {},
                el('p', { class: 'tag-to' }, `To: ${view.me.name}`),
                el('p', { class: 'tag-from' }, view.exchange.organizer
                  ? ['From the head elf, ', el('strong', {}, view.exchange.organizer)]
                  : 'From the North Pole'),
              ),
            ),
            el('div', { class: 'facts' }, exchangeFacts({ ...view.exchange, budget: '' })),
            budget && el('div', { class: 'price-tag' },
              el('span', { class: 'price-label' }, 'Spend up to'),
              el('span', { class: 'price' }, budget),
            ),
          ),
          view.exchange.note && el('p', { class: 'note' }, view.exchange.note),
        ),
        matchCard(view),
        wishlistCard(view),
      );
    }

    function matchCard(view) {
      if (!view.drawn) {
        return el('section', { class: 'card center' },
          el('h2', {}, 'The elves are still busy ⏳'),
          el('p', {}, `Names haven't been drawn yet. Come back to this same link once ${view.exchange.organizer || 'your organizer'} shakes the hat.`),
          el('p', { class: 'hint' }, 'In the meantime, add your wishlist below so your Santa knows what to get you.'),
        );
      }
      if (!view.revealed) return giftCard(view);
      return recipientCard(view.recipient);
    }

    function giftCard(view) {
      const gift = el('button', { class: 'gift', 'aria-label': 'Unwrap your match' },
        el('span', { class: 'gift-box' }),
        el('span', { class: 'gift-lid' }, el('span', { class: 'gift-bow' })),
      );
      const stage = el('div', { class: 'gift-stage ringed' }, gift, el('span', { class: 'tap-me', 'aria-hidden': 'true' }, 'Tap me!'));
      const unwrap = el('button', { class: 'btn', type: 'button', onclick: () => gift.click() }, 'Unwrap my match');
      const card = el('section', { class: 'card center' },
        el('h2', {}, 'A gift for you…'),
        el('p', { class: 'hint' }, "Make sure nobody's peeking over your shoulder!"),
        stage,
        el('div', { class: 'actions' }, unwrap),
      );

      gift.addEventListener('click', async () => {
        gift.disabled = true;
        unwrap.disabled = true;
        stage.classList.add('opening');
        gift.classList.add('opening');
        try {
          const [updated] = await Promise.all([
            api(`/api/santa/${token}/reveal`, { method: 'POST' }),
            new Promise((resolve) => setTimeout(resolve, 1300)),
          ]);
          card.replaceWith(recipientCard(updated.recipient));
          confetti();
        } catch (error) {
          gift.disabled = false;
          unwrap.disabled = false;
          stage.classList.remove('opening');
          gift.classList.remove('opening');
          toast(error.message, { error: true });
        }
      });
      return card;
    }

    const listPanel = (kind, title, text) => el('div', { class: `list-panel ${kind}` },
      el('h3', {}, title),
      text ? el('p', {}, text) : el('p', { class: 'hint' }, "Nothing yet. They might add one later, so check back here."),
    );

    function recipientCard(recipient) {
      return el('section', { class: 'card reveal' },
        el('p', { class: 'label' }, "You're the Secret Santa for"),
        el('div', { class: 'polaroid taped' },
          portrait(recipient),
          el('p', { class: 'name' }, recipient.name),
        ),
        listPanel('love', `🎁 ${recipient.name} would love`, recipient.wishlist),
        recipient.hardNos && listPanel('nos', '🚫 Hard nos', recipient.hardNos),
        el('p', { class: 'hint' }, '🤫 Keep it secret. Keep it safe.'),
      );
    }

    function wishlistCard(view) {
      const card = el('section', { class: 'card wishlist-card' });
      let lists = { wishlist: view.me.wishlist, hardNos: view.me.hardNos };
      const hasLists = () => Boolean(lists.wishlist || lists.hardNos);
      const title = () => el('h2', {}, 'Your wishlist 📝');

      function showSummary(justSaved) {
        card.replaceChildren(
          title(),
          justSaved && el('p', { class: 'saved-note', role: 'status' }, '✓ Saved. Your Santa will see this.'),
          lists.wishlist && listPanel('love', "🎁 Things I'd love", lists.wishlist),
          lists.hardNos && listPanel('nos', '🚫 Hard nos', lists.hardNos),
          el('div', { class: 'actions' }, el('button', { class: 'btn gold', type: 'button', onclick: showForm }, '✏️ Edit my lists')),
        );
      }

      function showForm() {
        const box = (label, value, placeholder) => {
          const input = el('textarea', { maxlength: 1000, rows: 4, placeholder, 'aria-label': label });
          input.value = value;
          return input;
        };
        const wish = box("Things I'd love", lists.wishlist, 'Cozy socks (size M)\nAnything dark chocolate\nA good mystery novel');
        const nos = box('Hard nos', lists.hardNos, 'No candles, please\nAllergic to peanuts');
        const save = el('button', { class: 'btn', type: 'button' }, 'Save my lists');
        save.addEventListener('click', async () => {
          save.disabled = true;
          try {
            const updated = await api(`/api/santa/${token}/wishlist`, { method: 'PUT', body: { wishlist: wish.value, hardNos: nos.value } });
            lists = { wishlist: updated.me.wishlist, hardNos: updated.me.hardNos };
            if (hasLists()) showSummary(true);
            else toast('Saved. Your lists are empty for now.');
          } catch (error) {
            toast(error.message, { error: true });
          } finally {
            save.disabled = false;
          }
        });
        card.replaceChildren(
          title(),
          el('p', { class: 'hint' }, 'Only your Secret Santa sees these.'),
          el('label', { class: 'list-label love' }, "🎁 Things I'd love", wish),
          el('label', { class: 'list-label nos' }, '🚫 Hard nos', nos),
          el('div', { class: 'actions' },
            hasLists() && el('button', { class: 'btn gold', type: 'button', onclick: () => showSummary(false) }, 'Cancel'),
            save,
          ),
        );
      }

      if (hasLists()) showSummary(false);
      else showForm();
      return card;
    }

    load();
  </script>
</body>
</html>
